# ==========================================================================
# CRE SECRETS TEMPLATE
# ==========================================================================
# Maps a logical secret name used by the workflow to the environment variable
# that supplies its value. Values themselves live in .env (git-ignored) for
# simulation, or in the Vault DON (`cre secrets create`) for a deployed
# workflow. Never put secret values in this file.
#
# This workflow needs no secrets: it reads a public Data Feed and writes through
# the EVM Write capability, so `secrets-path` is left empty in workflow.yaml.
# The template below is here for when one is needed.

secretsNames: {}
# secretsNames:
#   MY_API_KEY:
#     - MY_API_KEY_ENV
